<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;1,400&amp;family=Source+Sans+3:wght@300;400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header style="background:#ffffff;border-bottom:1px solid #dce4e0;font-family:'Source Sans 3',system-ui,sans-serif;color:#17211e">
<div style="max-width:{{mw}}px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px">
<a href="Main.dc.html" style="display:flex;align-items:center;text-decoration:none"><img src="/_blob/6da5d0e61d3aa9e61eb16b7ed2bce3e2" alt="SleepSteps home" style="height:68px;width:auto;display:block"></a>
<nav aria-label="Main" style="flex:1 1 auto">
<ul style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 28px;font-size:15px;font-weight:600;line-height:20px">
<sc-for list="{{links}}" as="l" hint-placeholder-count="4">
<li><a href="{{l.href}}" aria-current="{{l.cur}}" style="{{l.style}}">{{l.label}}</a></li>
</sc-for>
</ul>
</nav>
<form role="search" style="display:flex;align-items:center;margin:0">
<label for="site-q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Search sleep problems</label>
<input id="site-q" type="search" placeholder="Search sleep problems" style="height:44px;width:220px;box-sizing:border-box;border:1px solid #5a6b65;border-right:0;border-radius:6px 0 0 6px;padding:0 12px;font:inherit;font-size:15px;background:#ffffff;color:#17211e">
<button type="submit" aria-label="Search" style="height:44px;width:44px;border:0;border-radius:0 6px 6px 0;background:#0f6e56;color:#fbf9f5;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
</form>
<a href="Info-Urgent.dc.html" style="display:inline-block;padding:12px 0;color:#8a4a2c;font-size:15px;font-weight:600;line-height:20px">Get urgent help</a>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["home","start","problems","about","contact","info"],"default":"home"},"maxWidth":{"editor":"int","default":1280,"min":960,"max":1600,"unit":"px"},"$preview":{"width":1440,"height":93}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? 'home';
    const items = [
      ['start', 'Start here', 'Intro-B.dc.html'],
      ['problems', 'Sleep problems', 'Problems-A.dc.html'],
      ['about', 'About', 'Info-About.dc.html'],
      ['contact', 'Contact', 'Info-Contact.dc.html']
    ];
    return {
      mw: Number(this.props.maxWidth ?? 1280),
      links: items.map(([id, label, href]) => {
        const on = id === cur;
        return {
          label, href, cur: on ? 'page' : undefined,
          style: 'text-decoration:none;display:inline-block;padding:12px 0;' + (on ? 'color:#0f6e56;box-shadow:inset 0 -2px 0 #0f6e56' : 'color:#17211e')
        };
      })
    };
  }
}
</script>
</body>
</html>
